# Isolated Host instance used by test/e2e/local-two-instance.mjs.
# Everything here is local-only test configuration: no credentials, no real
# tokens. The model points at the local Ollama daemon, so the test exercises
# the real streaming path without touching an external API key.
#
# HMR is disabled for the isolated instances: on Windows the profile's
# package.json write can arrive just after the watcher starts and trigger a
# second webserver bind while the first listener is still closing.
- id: hmr
  disabled: true
- id: private-remote
  config:
    role: host
    port: !!js Number(process.env.DSH_E2E_REMOTE_PORT || 18084)
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: ollama
    model: deepseek-v4.1-flash:1017-cloud
    reasoningEffort: off
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama:
        displayName: Ollama
        api: openai-completions
        baseURL: http://localhost:11434/v1
        compat:
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          supportsStore: false
          maxTokensField: max_tokens
          thinkingFormat: openai
          requiresReasoningContentOnAssistantMessages: true
          supportsUsageInStreaming: true
          supportsStrictMode: false
        streamIdleTimeoutMs: 600000
        # Test-only dummy value: the local Ollama daemon ignores the key.
        apiKeyEnv: E2E_OLLAMA_KEY
        models:
          - id: deepseek-v4.1-flash:1017-cloud
            name: deepseek-v4.1-flash:1017-cloud
            contextWindow: 1048576
            maxTokens: 131072
            input: [text, image]
            reasoningEfforts:
              off: none
              low: low
              high: high
              max: max
